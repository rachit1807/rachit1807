name: Refresh contribution city

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render public contribution calendar
        run: python3 scripts/generate_contribution_city.py
      - name: Commit refreshed city
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-city.svg
          git diff --cached --quiet || git commit -m "Refresh contribution city"
          git push
