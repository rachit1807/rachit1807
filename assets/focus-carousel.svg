<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">Rachit's engineering focus carousel</title>
  <desc id="desc">A looping carousel of full-stack building, backend systems, and AI exploration.</desc>
  <rect width="900" height="230" rx="18" fill="#10070c" stroke="#451126" stroke-width="2"/>
  <path d="M24 52H876" stroke="#56303f"/>
  <text x="30" y="35" fill="#e5b5c7" font-family="monospace" font-size="13" letter-spacing="2">FOCUS AREAS  /  ROTATING READOUT</text>
  <g fill="#f8f0f3" font-family="Arial, sans-serif">
    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.28;0.34;0.98;1" dur="15s" repeatCount="indefinite"/>
      <text x="34" y="112" font-size="29" font-weight="700">FULL-STACK PRODUCTS</text>
      <text x="35" y="145" fill="#c77b9b" font-family="monospace" font-size="14">INTERFACE  →  API  →  DATA</text>
      <rect x="35" y="176" width="820" height="4" rx="2" fill="#3b202b"/>
      <rect x="35" y="176" width="820" height="4" rx="2" fill="#e5b5c7">
        <animate attributeName="width" values="0;820;0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.31;0.36;0.62;0.68" dur="15s" repeatCount="indefinite"/>
      <text x="34" y="112" font-size="29" font-weight="700">BACKEND SYSTEMS</text>
      <text x="35" y="145" fill="#c77b9b" font-family="monospace" font-size="14">REST APIs  ·  SERVICES  ·  DATABASES</text>
      <rect x="35" y="176" width="820" height="4" rx="2" fill="#3b202b"/>
      <rect x="35" y="176" width="820" height="4" rx="2" fill="#c77b9b">
        <animate attributeName="width" values="0;820;0" dur="5s" begin="5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.69;0.96;1" dur="15s" repeatCount="indefinite"/>
      <text x="34" y="112" font-size="29" font-weight="700">AI &amp; DEVELOPER TOOLS</text>
      <text x="35" y="145" fill="#c77b9b" font-family="monospace" font-size="14">MODEL-ASSISTED WORKFLOWS  ·  BUILD  ·  ITERATE</text>
      <rect x="35" y="176" width="820" height="4" rx="2" fill="#3b202b"/>
      <rect x="35" y="176" width="820" height="4" rx="2" fill="#e5b5c7">
        <animate attributeName="width" values="0;820;0" dur="5s" begin="10s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <circle cx="855" cy="29" r="4" fill="#e5b5c7"><animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/></circle>
</svg>
