<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Keep learning, keep building</title>
  <defs>
    <linearGradient id="footer-line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#451126"/>
      <stop offset=".5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D"/>
      <animate attributeName="x1" values="0;1200;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;2400;1200" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <path d="M24 15H1176" stroke="url(#footer-line)" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" fill="#E5B5C7" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4">KEEP LEARNING  ·  KEEP BUILDING</text>
  <text x="600" y="82" text-anchor="middle" fill="#C77B9B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">RACHIT TRIPATHI</text>
</svg>
