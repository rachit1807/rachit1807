<svg xmlns="http://www.w3.org/2000/svg" width="900" height="74" viewBox="0 0 900 74" role="img" aria-labelledby="title">
  <title id="title">Rachit's engineering roles cycling continuously</title>
  <rect width="900" height="74" rx="14" fill="#10070c" stroke="#451126" stroke-width="2"/>
  <text x="26" y="44" fill="#754b5b" font-family="monospace" font-size="12" letter-spacing="2">ROLE /</text>
  <g fill="#f8f0f3" font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <text x="115" y="47" opacity="0">FULL-STACK DEVELOPER<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.25;0.32;0.98;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="115" y="47" opacity="0">BACKEND &amp; API BUILDER<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.34;0.62;0.68" dur="12s" repeatCount="indefinite"/></text>
    <text x="115" y="47" opacity="0">AI &amp; DEVELOPER TOOLS<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.61;0.67;0.95;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <circle cx="856" cy="37" r="6" fill="#c77b9b"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>
