<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Rachit's technology orbit</title>
  <desc id="desc">React, JavaScript, Python, Node.js, FastAPI, PostgreSQL, MongoDB, Git and Docker orbit a central systems core.</desc>
  <rect width="900" height="360" rx="18" fill="#10070c" stroke="#451126" stroke-width="2"/>
  <text x="30" y="38" fill="#e5b5c7" font-family="monospace" font-size="13" letter-spacing="2">TECH ORBIT  /  STACK SIGNAL</text>
  <ellipse cx="450" cy="195" rx="310" ry="105" fill="none" stroke="#56303f" stroke-width="1.5"/>
  <ellipse cx="450" cy="195" rx="220" ry="72" fill="none" stroke="#3b202b" stroke-width="1.5" transform="rotate(-22 450 195)"/>
  <circle cx="450" cy="195" r="58" fill="#21131b" stroke="#c77b9b" stroke-width="2"/>
  <circle cx="450" cy="195" r="44" fill="none" stroke="#e5b5c7" stroke-opacity=".4"><animate attributeName="r" values="40;49;40" dur="3s" repeatCount="indefinite"/></circle>
  <text x="450" y="190" fill="#f8f0f3" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="1">SYSTEM</text>
  <text x="450" y="211" fill="#c77b9b" text-anchor="middle" font-family="monospace" font-size="12">CORE</text>
  <g font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">
    <g><animateTransform attributeName="transform" type="rotate" from="0 450 195" to="360 450 195" dur="24s" repeatCount="indefinite"/><circle cx="450" cy="90" r="24" fill="#451126" stroke="#c77b9b"/><text x="450" y="95" fill="#f8f0f3">JS</text></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0 450 195" to="-360 450 195" dur="30s" repeatCount="indefinite"/><circle cx="760" cy="195" r="28" fill="#21131b" stroke="#e5b5c7"/><text x="760" y="200" fill="#f8f0f3">REACT</text></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0 450 195" to="360 450 195" dur="36s" repeatCount="indefinite"/><circle cx="450" cy="300" r="24" fill="#451126" stroke="#c77b9b"/><text x="450" y="305" fill="#f8f0f3">PY</text></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0 450 195" to="-360 450 195" dur="28s" repeatCount="indefinite"/><circle cx="140" cy="195" r="28" fill="#21131b" stroke="#e5b5c7"/><text x="140" y="200" fill="#f8f0f3">NODE</text></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0 450 195" to="360 450 195" dur="20s" repeatCount="indefinite"/><circle cx="288" cy="120" r="25" fill="#451126" stroke="#c77b9b"/><text x="288" y="125" fill="#f8f0f3">SQL</text></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0 450 195" to="-360 450 195" dur="32s" repeatCount="indefinite"/><circle cx="612" cy="270" r="27" fill="#21131b" stroke="#e5b5c7"/><text x="612" y="275" fill="#f8f0f3">GIT</text></g>
  </g>
  <text x="450" y="340" fill="#754b5b" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="1">JAVASCRIPT  ·  REACT  ·  PYTHON  ·  NODE.JS  ·  FASTAPI  ·  POSTGRESQL  ·  MONGODB  ·  DOCKER</text>
</svg>
